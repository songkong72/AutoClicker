name: Android unit tests

# 문서만 바뀐 커밋은 앱이 달라지지 않으므로 돌지 않는다.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
      - name: Summarize gradle log
        if: always()
        shell: bash
        run: |
          { echo '```'; tail -n 80 ../gradle.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          MSG=$(grep -E 'FAILED|What went wrong|Could not|error:|BUILD|tests completed|Exception' ../gradle.log | head -n 15 | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=gradle-log::${MSG}"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android-app/app/build/reports/tests/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
